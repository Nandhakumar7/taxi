spring:
  application:
    name: taxi-booking-app
  
  # Database Configuration
  datasource:
    url: jdbc:h2:mem:taxiapp;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  # H2 Console Configuration
  h2:
    console:
      enabled: true
      path: /h2-console
  
# Server Configuration
server:
  port: 8080
  servlet:
    context-path: /api/v1

# JWT Configuration
jwt:
  secret: your-256-bit-secret-key-here
  expiration: 86400000 # 24 hours in milliseconds
  refresh-token:
    expiration: 2592000000 # 30 days in milliseconds

# Logging Configuration
logging:
  level:
    root: INFO
    com.taxiapp: DEBUG
    org.springframework.web: INFO
    org.hibernate: INFO 